<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Agentic BayesX multi-agent workflow</title>
  <desc id="desc">Infographic showing the human lead, master Claude Code agent, isolated experiment runners, shared evidence folder, review agents, and framing challenger.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f5; }
      .title { font: 700 54px Arial, Helvetica, sans-serif; fill: #1f2933; letter-spacing: 0; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #4b5563; letter-spacing: 0; }
      .section { font: 700 30px Arial, Helvetica, sans-serif; fill: #233044; letter-spacing: 0; }
      .sectionSub { font: 400 21px Arial, Helvetica, sans-serif; fill: #4b5563; letter-spacing: 0; }
      .label { font: 700 29px Arial, Helvetica, sans-serif; fill: #18212f; letter-spacing: 0; }
      .body { font: 400 22px Arial, Helvetica, sans-serif; fill: #243244; letter-spacing: 0; }
      .small { font: 400 19px Arial, Helvetica, sans-serif; fill: #4b5563; letter-spacing: 0; }
      .tiny { font: 400 16px Arial, Helvetica, sans-serif; fill: #596273; letter-spacing: 0; }
      .card { stroke: #263548; stroke-width: 3; rx: 18; }
      .human { fill: #ffffff; }
      .master { fill: #e3efff; }
      .runner { fill: #fff1cf; }
      .review { fill: #e8f7eb; }
      .challenge { fill: #fff0ea; }
      .artifact { fill: #f0eefb; }
      .note { fill: #ffffff; stroke: #9aa4b2; stroke-width: 2; rx: 15; }
      .bus { stroke: #344256; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #344256; stroke-width: 4.5; fill: none; marker-end: url(#arrowhead); stroke-linecap: round; stroke-linejoin: round; }
      .arrowSoft { stroke: #6b7280; stroke-width: 3.5; fill: none; marker-end: url(#arrowheadSoft); stroke-dasharray: 10 9; stroke-linecap: round; stroke-linejoin: round; }
      .loop { stroke: #2563eb; stroke-width: 5; fill: none; marker-end: url(#arrowheadBlue); stroke-linecap: round; stroke-linejoin: round; }
      .challengeArrow { stroke: #d0563f; stroke-width: 4.5; fill: none; marker-end: url(#arrowheadRed); stroke-dasharray: 11 8; stroke-linecap: round; stroke-linejoin: round; }
      .laneLabel { font: 700 16px Arial, Helvetica, sans-serif; fill: #344256; letter-spacing: 0; }
    </style>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#344256"/>
    </marker>
    <marker id="arrowheadSoft" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#d0563f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1400"/>

  <text class="title" x="70" y="82">Agentic BayesX Multi-Agent Workflow</text>
  <text class="subtitle" x="74" y="126">Several agents try the research task. Other agents check their work. One agent challenges the whole framing. The human decides what matters.</text>

  <!-- Top decision loop -->
  <rect class="card human" x="625" y="165" width="650" height="165"/>
  <text class="label" x="950" y="213" text-anchor="middle">Human Lead</text>
  <text class="body" x="670" y="254">Chooses the question, approves the plan,</text>
  <text class="body" x="670" y="284">judges tradeoffs, and decides what to trust.</text>
  <text class="small" x="670" y="314">Final call: keep, revise, reject, or ask a better question.</text>

  <rect class="card master" x="585" y="430" width="730" height="200"/>
  <text class="label" x="950" y="482" text-anchor="middle">Master Agent: Claude Code Opus 4.8</text>
  <text class="body" x="635" y="528">Turns the human goal into task cards.</text>
  <text class="body" x="635" y="560">Starts helper agents with clear prompts.</text>
  <text class="body" x="635" y="592">Compares results and asks before changing rules.</text>

  <path class="loop" d="M 950 330 L 950 426"/>
  <path class="loop" d="M 1325 526 C 1485 482, 1505 278, 1280 247"/>
  <text class="laneLabel" x="1375" y="404">asks for approval</text>

  <!-- Section headings -->
  <text class="section" x="95" y="720">Experiment Runners</text>
  <text class="sectionSub" x="95" y="752">Each runner attempts the full experiment in isolation.</text>

  <text class="section" x="1455" y="720">Review And Challenge Agents</text>
  <text class="sectionSub" x="1455" y="752">They read runner evidence and report back to the master.</text>

  <!-- Runners -->
  <rect class="card runner" x="90" y="795" width="445" height="135"/>
  <text class="label" x="312" y="842" text-anchor="middle">Cursor Composer 2.5</text>
  <text class="body" x="125" y="882">Tries one full implementation.</text>
  <text class="body" x="125" y="912">Writes its own report and files.</text>

  <rect class="card runner" x="90" y="975" width="445" height="135"/>
  <text class="label" x="312" y="1022" text-anchor="middle">Claude Code Opus 4.8</text>
  <text class="body" x="125" y="1062">Tries one full implementation.</text>
  <text class="body" x="125" y="1092">May succeed, fail, or reveal gaps.</text>

  <rect class="card runner" x="90" y="1155" width="445" height="105"/>
  <text class="label" x="312" y="1201" text-anchor="middle">Codex GPT-5.5</text>
  <text class="body" x="125" y="1239">Tries one full implementation.</text>

  <!-- Shared evidence -->
  <rect class="card artifact" x="620" y="765" width="660" height="430"/>
  <text class="label" x="950" y="817" text-anchor="middle">Shared Evidence Folder</text>
  <text class="body" x="675" y="865">Each runner writes:</text>
  <text class="body" x="715" y="903">- task card and assumptions</text>
  <text class="body" x="715" y="936">- code changes and commands</text>
  <text class="body" x="715" y="969">- plots and generated data</text>
  <text class="body" x="715" y="1002">- NUTS/HMC diagnostics if claimed</text>
  <text class="body" x="715" y="1035">- checker output and known failures</text>
  <text class="body" x="715" y="1068">- a short review request</text>
  <rect class="note" x="685" y="1115" width="530" height="46"/>
  <text class="small" x="950" y="1144" text-anchor="middle">No file-backed evidence, no success claim.</text>

  <!-- Reviewers -->
  <rect class="card review" x="1425" y="795" width="410" height="115"/>
  <text class="label" x="1630" y="837" text-anchor="middle">Literature Reader</text>
  <text class="body" x="1458" y="876">Finds sources and says what each supports.</text>

  <rect class="card review" x="1425" y="945" width="410" height="115"/>
  <text class="label" x="1630" y="987" text-anchor="middle">Technical Reviewer</text>
  <text class="body" x="1458" y="1026">Checks physics, units, plots, and assumptions.</text>

  <rect class="card review" x="1425" y="1095" width="410" height="115"/>
  <text class="label" x="1630" y="1137" text-anchor="middle">Integrity Reviewer</text>
  <text class="body" x="1458" y="1176">Looks for copied outputs, hidden swaps,</text>
  <text class="body" x="1458" y="1206">weak checks, and overclaiming.</text>

  <rect class="card challenge" x="1425" y="1245" width="410" height="115"/>
  <text class="label" x="1630" y="1286" text-anchor="middle">Framing Challenger</text>
  <text class="body" x="1458" y="1324">Asks if this is the right decision,</text>
  <text class="body" x="1458" y="1354">QOI, test plan, or next question.</text>

  <!-- Framing challenger expanded card -->
  <rect class="card challenge" x="585" y="660" width="730" height="70"/>
  <text class="label" x="950" y="704" text-anchor="middle">Framing Challenger asks: are we solving the right problem?</text>

  <!-- Master dispatch lanes; routed outside text blocks -->
  <path class="bus" d="M 585 560 L 560 560 L 560 742"/>
  <path class="arrow" d="M 560 840 L 538 840"/>
  <path class="arrow" d="M 560 1020 L 538 1020"/>
  <path class="arrow" d="M 560 1195 L 538 1195"/>
  <text class="laneLabel" x="405" y="705">master sends runner prompts</text>

  <path class="bus" d="M 1315 560 L 1345 560 L 1345 742"/>
  <path class="arrow" d="M 1345 852 L 1420 852"/>
  <path class="arrow" d="M 1345 1002 L 1420 1002"/>
  <path class="arrow" d="M 1345 1152 L 1420 1152"/>
  <path class="arrow" d="M 1345 1275 L 1420 1275"/>
  <text class="laneLabel" x="1362" y="705">master sends review prompts</text>

  <path class="arrow" d="M 950 630 L 950 760"/>
  <text class="laneLabel" x="970" y="705">task cards and expected folders</text>

  <!-- Runner outputs to shared evidence; short arrows through open gutter -->
  <path class="arrowSoft" d="M 538 862 L 615 862"/>
  <path class="arrowSoft" d="M 538 1042 L 615 1042"/>
  <path class="arrowSoft" d="M 538 1205 C 570 1205, 590 1175, 618 1148"/>
  <text class="laneLabel" x="525" y="790">reports and files</text>

  <!-- Evidence to review agents; arrows through right gutter -->
  <path class="arrowSoft" d="M 1285 850 L 1420 850"/>
  <path class="arrowSoft" d="M 1285 1000 L 1420 1000"/>
  <path class="arrowSoft" d="M 1285 1150 L 1420 1150"/>
  <path class="challengeArrow" d="M 1285 1185 C 1345 1230, 1370 1275, 1420 1275"/>
  <text class="laneLabel" x="1308" y="798">evidence for review</text>

  <!-- Review feedback to master, routed around outside edge -->
  <path class="arrowSoft" d="M 1630 795 C 1630 650, 1450 555, 1320 555"/>
  <path class="arrowSoft" d="M 1630 945 C 1630 720, 1465 590, 1320 590"/>
  <path class="arrowSoft" d="M 1630 1095 C 1630 790, 1485 620, 1320 620"/>
  <path class="challengeArrow" d="M 1630 1245 C 1665 980, 1565 690, 1320 610"/>
  <text class="laneLabel" x="1650" y="725">findings flow back</text>

  <!-- Framing challenger relationship -->
  <path class="challengeArrow" d="M 950 765 L 950 735"/>
  <path class="challengeArrow" d="M 950 660 L 950 635"/>
  <text class="laneLabel" x="985" y="755">after runner results</text>

  <!-- Bottom reminder -->
  <rect class="note" x="575" y="1248" width="750" height="54"/>
  <text class="body" x="950" y="1282" text-anchor="middle">The point is not that every runner is right. The point is that mistakes become visible.</text>
</svg>
