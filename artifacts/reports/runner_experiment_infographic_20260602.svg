<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Runner experiment infographic for Agentic BayesX</title>
  <desc id="desc">Plain-English overview of the sequential dome and tray vibration experiment assigned to each runner agent.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .ink { fill: #18212f; }
      .muted { fill: #56606e; }
      .small { font: 400 20px Arial, Helvetica, sans-serif; }
      .tiny { font: 400 17px Arial, Helvetica, sans-serif; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .title { font: 700 44px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; }
      .card-title { font: 700 25px Arial, Helvetica, sans-serif; }
      .card { fill: #ffffff; stroke: #d8d2c3; stroke-width: 2; rx: 10; }
      .card-blue { fill: #e9f3ff; stroke: #83afd9; stroke-width: 2; rx: 10; }
      .card-green { fill: #edf7ef; stroke: #7fb38a; stroke-width: 2; rx: 10; }
      .card-gold { fill: #fff2d8; stroke: #cfaa58; stroke-width: 2; rx: 10; }
      .card-red { fill: #ffe9e3; stroke: #d88c77; stroke-width: 2; rx: 10; }
      .card-purple { fill: #f0ebff; stroke: #a899d9; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #4c5968; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #687384; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 8; }
      .soft-line { fill: none; stroke: #a8a092; stroke-width: 2; stroke-linecap: round; }
      .tag { fill: #18212f; rx: 14; }
      .tag-text { fill: #ffffff; font: 700 16px Arial, Helvetica, sans-serif; }
      .axis { stroke: #4c5968; stroke-width: 2; }
      .psd { fill: none; stroke: #2970a8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .psd2 { fill: none; stroke: #b36b2c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .qoi { fill: none; stroke: #5d8c61; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .dot-blue { fill: #2970a8; }
      .dot-orange { fill: #b36b2c; }
      .dot-green { fill: #5d8c61; }
      .dot-purple { fill: #725bb8; }
      .callout { fill: #ffffff; stroke: #c7bfad; stroke-width: 2; rx: 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c5968"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980"/>

  <text class="title ink" x="60" y="70">Experiment Each Runner Agent Is Asked To Run</text>
  <text class="subtitle muted" x="60" y="108">Same assignment for Cursor Composer 2.5, Claude Code Opus 4.8, and Codex GPT-5.5. Failure is allowed, but claims need files and checks.</text>

  <rect class="tag" x="60" y="136" width="300" height="34"/>
  <text class="tag-text" x="78" y="159">Sequential dome/tray vibration study</text>
  <rect class="tag" x="380" y="136" width="225" height="34"/>
  <text class="tag-text" x="398" y="159">NUTS/HMC required</text>
  <rect class="tag" x="625" y="136" width="250" height="34"/>
  <text class="tag-text" x="643" y="159">PSD-space dB convention</text>
  <rect class="tag" x="895" y="136" width="230" height="34"/>
  <text class="tag-text" x="913" y="159">Matérn GP forcing</text>
  <rect class="tag" x="1145" y="136" width="190" height="34"/>
  <text class="tag-text" x="1163" y="159">Evidence packet</text>

  <!-- System and inputs -->
  <rect class="card-blue" x="60" y="205" width="360" height="235"/>
  <text class="card-title ink" x="86" y="242">1. Start From The Same World</text>
  <text class="small ink" x="86" y="280">Physical model</text>
  <text class="tiny muted" x="110" y="310">tank / dome / source = m1</text>
  <text class="tiny muted" x="110" y="336">tray / load / secondary structure = m2</text>
  <text class="small ink" x="86" y="374">Given forcing spec</text>
  <text class="tiny muted" x="110" y="402">20, 100, 750, 2000 Hz PSD points</text>
  <text class="tiny muted" x="110" y="428">dB acts on PSD: factor = 10^(dB/10)</text>

  <g transform="translate(108 462)">
    <rect class="callout" x="0" y="0" width="250" height="68"/>
    <text class="tiny ink" x="18" y="27">Known: 3 dB flight-to-flight</text>
    <text class="tiny ink" x="18" y="51">Learn: build scatter + sensor noise</text>
  </g>

  <!-- Flow stages -->
  <rect class="card-green" x="500" y="205" width="390" height="235"/>
  <text class="card-title ink" x="526" y="242">2. Recreate The Ground Tests</text>
  <text class="tiny muted" x="526" y="280">A. Dome-only FEM with flat broadband input.</text>
  <text class="tiny muted" x="526" y="308">    Peak dome PSD should hit 0.1 g^2/Hz.</text>
  <text class="tiny muted" x="526" y="340">B. Tray vibe test to the smoothline spec.</text>
  <text class="tiny muted" x="526" y="368">    Include tray build scatter and sensor noise.</text>
  <text class="tiny muted" x="526" y="400">C. Save the tray 3 x GRMS response from vibe.</text>

  <rect class="card-gold" x="970" y="205" width="370" height="235"/>
  <text class="card-title ink" x="996" y="242">3. Update From Modal Tests</text>
  <text class="tiny muted" x="996" y="280">Tank-only modal test: estimate m1 fn and damping.</text>
  <text class="tiny muted" x="996" y="316">Coupled tank + tray modal test:</text>
  <text class="tiny muted" x="1020" y="344">impact at interface and at tray.</text>
  <text class="tiny muted" x="996" y="380">Use same build offsets from earlier tests.</text>
  <text class="tiny muted" x="996" y="416">Compare whole-FRF likelihood vs peak-only data.</text>

  <path class="line" marker-end="url(#arrow)" d="M 425 322 L 490 322"/>
  <path class="line" marker-end="url(#arrow)" d="M 895 322 L 960 322"/>

  <!-- Flight and inference -->
  <rect class="card-purple" x="60" y="570" width="390" height="255"/>
  <text class="card-title ink" x="86" y="607">4. Fly The Builds</text>
  <text class="tiny muted" x="86" y="645">First flight uses the same build offsets.</text>
  <text class="tiny muted" x="86" y="675">Measure interface acceleration and tray response.</text>
  <text class="tiny muted" x="86" y="705">Forcing into m1 is a Matérn GP in log PSD.</text>
  <text class="tiny muted" x="86" y="735">Mean forcing is 6 dB below the original spec.</text>
  <text class="tiny muted" x="86" y="765">Run 10 more new builds and flights.</text>
  <text class="tiny muted" x="86" y="795">No more modal tests after the first set.</text>

  <rect class="card-red" x="505" y="570" width="385" height="255"/>
  <text class="card-title ink" x="531" y="607">5. Do The Bayesian Update</text>
  <text class="tiny muted" x="531" y="645">Use NUTS/HMC if posterior inference is claimed.</text>
  <text class="tiny muted" x="531" y="675">Estimate fn and damping for m1 and m2.</text>
  <text class="tiny muted" x="531" y="705">Estimate build scatter and sensor noise.</text>
  <text class="tiny muted" x="531" y="735">Infer interface spectra and tray 3 x RMS / GRMS.</text>
  <text class="tiny muted" x="531" y="765">Report divergences, ESS, R-hat, step size, tree depth.</text>
  <text class="tiny muted" x="531" y="795">If a method changes, label it plainly.</text>

  <rect class="card" x="970" y="570" width="370" height="255"/>
  <text class="card-title ink" x="996" y="607">6. Leave Reviewable Evidence</text>
  <text class="tiny muted" x="996" y="645">One command to rerun the runner packet.</text>
  <text class="tiny muted" x="996" y="675">Plots of spec, data, posteriors, residuals.</text>
  <text class="tiny muted" x="996" y="705">95% and 99% spectra and QOI intervals.</text>
  <text class="tiny muted" x="996" y="735">Manifest, commands, checks, assumptions, sources.</text>
  <text class="tiny muted" x="996" y="765">Known failures and a review request.</text>
  <text class="tiny muted" x="996" y="795">Checker pass does not prove the physics.</text>

  <path class="line" marker-end="url(#arrow)" d="M 1160 448 C 1160 510 255 508 255 560"/>
  <path class="line" marker-end="url(#arrow)" d="M 455 698 L 495 698"/>
  <path class="line" marker-end="url(#arrow)" d="M 895 698 L 960 698"/>

  <!-- Small plot sketches -->
  <g transform="translate(92 220)">
    <line class="axis" x1="0" y1="190" x2="120" y2="190"/>
    <line class="axis" x1="0" y1="190" x2="0" y2="115"/>
    <path class="psd" d="M 6 175 L 32 150 L 78 150 L 114 185"/>
    <text class="tiny muted" x="12" y="108">smoothline PSD</text>
  </g>

  <g transform="translate(622 448)">
    <line class="axis" x1="0" y1="82" x2="140" y2="82"/>
    <line class="axis" x1="0" y1="82" x2="0" y2="8"/>
    <path class="psd2" d="M 5 75 C 35 55, 45 12, 67 35 S 95 75, 135 32"/>
    <circle class="dot-orange" cx="65" cy="34" r="5"/>
    <text class="tiny muted" x="10" y="104">whole curve and peaks</text>
  </g>

  <g transform="translate(1030 448)">
    <line class="axis" x1="0" y1="82" x2="150" y2="82"/>
    <line class="axis" x1="0" y1="82" x2="0" y2="8"/>
    <path class="qoi" d="M 8 72 L 26 66 L 44 61 L 62 57 L 80 52 L 98 50 L 116 48 L 136 45"/>
    <circle class="dot-green" cx="8" cy="72" r="4"/>
    <circle class="dot-green" cx="44" cy="61" r="4"/>
    <circle class="dot-green" cx="80" cy="52" r="4"/>
    <circle class="dot-green" cx="136" cy="45" r="4"/>
    <text class="tiny muted" x="4" y="104">flight-by-flight QOI</text>
  </g>

  <!-- Bottom review strip -->
  <rect class="card-blue" x="60" y="875" width="1280" height="62"/>
  <text class="label ink" x="88" y="912">After runners finish:</text>
  <text class="small muted" x="280" y="912">reader checks sources, technical reviewer checks physics, integrity reviewer looks for shortcuts, master and human decide the next loop.</text>

  <!-- Guardrail callouts -->
  <g transform="translate(1120 28)">
    <rect class="callout" x="0" y="0" width="220" height="78"/>
    <circle class="dot-purple" cx="22" cy="26" r="6"/>
    <text class="tiny ink" x="40" y="31">Same prompt</text>
    <circle class="dot-blue" cx="22" cy="54" r="6"/>
    <text class="tiny ink" x="40" y="59">Separate folders</text>
  </g>

  <path class="dash" d="M 250 535 C 420 475, 545 482, 690 535"/>
  <text class="tiny muted" x="424" y="512">same first build carries through</text>
</svg>
